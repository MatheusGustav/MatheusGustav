name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12h
  workflow_dispatch:          # botão manual na aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recortar a moldura (impede a cobrinha de escapar da grade)
        run: |
          sudo chown -R "$USER" dist
          for f in dist/snake.svg dist/snake-dark.svg; do
            sed -i -E \
              -e 's/viewBox="-16 -32 880 192"/viewBox="-16 -10 880 132"/' \
              -e 's/height="192"/height="132"/' "$f"
          done

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
